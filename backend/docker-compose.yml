name: beacon_backend

services:
  beacon_db: 
    container_name: "beacon_postgres_db"
    image: postgres:16
    networks: 
      - default
    restart: always
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?required}
      POSTGRES_USER: ${POSTGRES_USER:?required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
  beacon_backend:
    container_name: "beacon_backend"
    networks: 
      - default
    build: 
      context: .
      target: dev
    volumes:
      - .:/app
      - /app/tmp 
    ports:
      - "8080:8080"
    command: ["make", "api"]
    depends_on:
      beacon_db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/v1/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 60s
  beacon_simulator:
    container_name: "beacon_simulator"
    networks:
      - default
    build: 
      context: .
      target: dev
    volumes:
      - .:/app
      - /app/tmp
    command: ["make", "sim"]
    environment:
      # .env points at 127.0.0.1 for running the simulator outside docker;
      # in compose the api is a separate container
      API_BASE_URL: http://beacon_backend:8080
    depends_on:
      beacon_backend:
        condition: service_healthy


networks:
  default:

volumes:
  pgdata:
